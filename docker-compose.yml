services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniride-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5007
      - Jwt__Key=${JWT_KEY:?JWT_KEY is required}
      - AdminSettings__Email=${ADMIN_EMAIL:-}
      - AdminSettings__Password=${ADMIN_PASSWORD:-}
      - AdminSettings__FullName=${ADMIN_FULL_NAME:-System Administrator}
      - AdminSettings__PhoneNumber=${ADMIN_PHONE_NUMBER:-}
      - EmailSettings__SenderEmail=${SMTP_SENDER_EMAIL:-}
      - EmailSettings__Password=${SMTP_PASSWORD:-}
    volumes:
      - sqlite-data:/data
    networks:
      - uniride-net
    expose:
      - "5007"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: uniride-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - uniride-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  uniride-net:
    driver: bridge

volumes:
  sqlite-data:
